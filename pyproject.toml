[project]
name = "github-practice-ai"
version = "0.1.0"
description = "Senior production-ready AI SDK - README=Reality, strict CI, mocked tests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "【entity-MIT¦canonical_name=MIT】"}
dependencies = [
    "github-practice==0.4.2",
    "httpx==0.27.0",
    "openai==1.40.0",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "pytest-cov", "ruff"]

[project.scripts]
gh-ai = "stage2_sdk_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stage2_sdk_ai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E","F","I","B","C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=stage2_sdk_ai --cov-fail-under=50"
