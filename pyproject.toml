[project]
name = "github-practice-ai"
version = "1.1.1"
description = "Senior production-ready AI SDK - frozen AIConfig, semaphore 3, TTL cache, RAG, Agent, Tracing, Orchestrator, Swarm, GuardedEval - built mobile-first on Termux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = " MIT" }
dependencies = [
    "openai==1.40.0",
    "httpx==0.27.0",
    "cachetools>=5.0",
    "anyio>=4.0",
    "distro>=1.7.0",
    "jiter>=0.4.0,<1",
    "fastapi>=0.115",
    "pydantic>=2.12",
]

[project.optional-dependencies]
audit-s3 = [
    "boto3>=1.34",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.9.0",
]
termux = [
    "maturin>=1.0",
]

[project.scripts]
gh-ai = "stage2_sdk_ai.cli:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "B9"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=stage2_sdk_ai --cov-report=term --cov-fail-under=80"

[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stage2_sdk_ai"]
