name: CI Senior v1.0

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps (binary-only, no Rust build)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --only-binary=:all:
          pip install -e ".[dev]"
      - name: Ruff check (strict - FAILS job)
        run: ruff check .
      - name: Tests mocked (offline <1s)
        run: PYTHONPATH=. CI=true OPENAI_API_KEY=sk-test-mocked pytest -v
      - name: gh-ai check
        run: gh-ai --check
