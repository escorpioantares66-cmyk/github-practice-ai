name: Termux pydantic-core 2.50.4 native reproducibility

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/termux-pydantic-core-reproducible.yml"
      - "packaging/termux/python-pydantic-core/**"
      - "docs/termux-native-dependency-provenance.md"

permissions:
  contents: read

env:
  PYDANTIC_REPOSITORY: pydantic/pydantic
  PYDANTIC_TAG: core-v2.50.4
  PYDANTIC_COMMIT: ea492e04654ab7f7a1f9287ea912419452ead4dd
  TERMUX_PACKAGES_COMMIT: 74a426129b7e868858a7b2329b9a12a5da0c5250
  TERMUX_BUILDER_IMAGE: ghcr.io/termux/package-builder@sha256:44999857244619e25bc8e3427904a16d36cc0c0e087704af039e5bdf94814ac9

jobs:
  source-identity:
    name: Verify immutable upstream pydantic-core 2.50.4 source
    runs-on: ubuntu-26.04
    steps:
      - name: Check out exact upstream commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pydantic/pydantic
          ref: ea492e04654ab7f7a1f9287ea912419452ead4dd
          path: pydantic-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, commit, manifest, and lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pydantic-source rev-parse HEAD)" = "$PYDANTIC_COMMIT"
          test "$(git -C pydantic-source rev-parse 'refs/tags/core-v2.50.4^{commit}')" = "$PYDANTIC_COMMIT"
          python3 - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path("pydantic-source/pydantic-core")
          cargo = tomllib.loads((root / "Cargo.toml").read_text())
          lock = tomllib.loads((root / "Cargo.lock").read_text())
          pyproject = tomllib.loads((root / "pyproject.toml").read_text())

          assert cargo["package"]["version"] == "2.50.4"
          assert cargo["dependencies"]["jiter"]["version"] == "0.18.0"
          jiter = [p for p in lock["package"] if p["name"] == "jiter"]
          assert len(jiter) == 1 and jiter[0]["version"] == "0.18.0"
          assert any(x.startswith("maturin>=1.16.0,<2") for x in pyproject["build-system"]["requires"])
          assert cargo["package"]["rust-version"] == "1.88"

          print("pydantic-core:", cargo["package"]["version"])
          print("jiter dependency:", jiter[0]["version"])
          print("Rust MSRV:", cargo["package"]["rust-version"])
          print("build backend:", pyproject["build-system"]["requires"])
          PY
          {
            echo "repository=https://github.com/$PYDANTIC_REPOSITORY"
            echo "tag=$PYDANTIC_TAG"
            echo "commit=$(git -C pydantic-source rev-parse HEAD)"
            echo "pydantic_core_tree=$(git -C pydantic-source rev-parse HEAD:pydantic-core)"
            echo "cargo_toml_blob=$(git -C pydantic-source rev-parse HEAD:pydantic-core/Cargo.toml)"
            echo "cargo_lock_blob=$(git -C pydantic-source rev-parse HEAD:pydantic-core/Cargo.lock)"
            echo "pyproject_blob=$(git -C pydantic-source rev-parse HEAD:pydantic-core/pyproject.toml)"
            echo "declared_version=2.50.4"
            echo "jiter_version=0.18.0"
            echo "rust_version=1.88"
            echo "pypi_provenance=absent; official upstream git commit is source identity"
          } > pydantic-core-2.50.4-source-identity.txt
          cat pydantic-core-2.50.4-source-identity.txt

      - name: Upload immutable source identity record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pydantic-core-2.50.4-source-identity
          path: pydantic-core-2.50.4-source-identity.txt
          if-no-files-found: error
          retention-days: 90

  build:
    name: Independent Termux build replica
    needs: source-identity
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - name: Check out investigation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact upstream source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pydantic/pydantic
          ref: ea492e04654ab7f7a1f9287ea912419452ead4dd
          path: pydantic-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned official Termux build system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termux/termux-packages
          ref: 74a426129b7e868858a7b2329b9a12a5da0c5250
          path: termux-packages
          persist-credentials: false

      - name: Prepare exact upstream source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pydantic-source rev-parse HEAD)" = "$PYDANTIC_COMMIT"
          test "$(git -C pydantic-source rev-parse 'refs/tags/core-v2.50.4^{commit}')" = "$PYDANTIC_COMMIT"
          test "$(git -C termux-packages rev-parse HEAD)" = "$TERMUX_PACKAGES_COMMIT"
          test ! -e termux-packages/pydantic-core-source
          cp -a pydantic-source/pydantic-core termux-packages/pydantic-core-source
          mkdir -p termux-packages/packages/python-pydantic-core
          install -m 0644 packaging/termux/python-pydantic-core/build.sh termux-packages/packages/python-pydantic-core/build.sh
          chmod +x termux-packages/packages/python-pydantic-core/build.sh
          bash -n packaging/termux/python-pydantic-core/build.sh
          test -s termux-packages/pydantic-core-source/Cargo.lock

      - name: Build exact package in pinned Termux builder
        shell: bash
        run: |
          set -euo pipefail
          cd termux-packages
          TERMUX_BUILDER_IMAGE_NAME="$TERMUX_BUILDER_IMAGE" ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 python-pydantic-core

      - name: Inspect package metadata and native ELF
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find termux-packages -type f -name 'python-pydantic-core_2.50.4_aarch64.deb' -not -path '*/.git/*' -print)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"

          test "$(dpkg-deb -f "$package" Package)" = "python-pydantic-core"
          test "$(dpkg-deb -f "$package" Version)" = "2.50.4"
          test "$(dpkg-deb -f "$package" Architecture)" = "aarch64"

          mkdir extracted
          dpkg-deb --extract "$package" extracted
          mapfile -t extensions < <(find extracted -type f -path '*/site-packages/pydantic_core/_pydantic_core*.so' -print)
          test "${#extensions[@]}" -eq 1
          extension="${extensions[0]}"

          readelf -h "$extension" | grep -F "AArch64"
          needed_count="$(readelf -d "$extension" | grep -Fc 'Shared library: [libpython3.14.so]')"
          test "$needed_count" -eq 1
          readelf -d "$extension" | grep -F 'Library runpath: [/data/data/com.termux/files/usr/lib]'
          if readelf --version-info "$extension" | grep -q "GLIBC_"; then
            echo "Unexpected GLIBC symbol version requirement in Android ELF" >&2
            exit 1
          fi

          mkdir results
          cp "$package" results/python-pydantic-core_2.50.4_aarch64.deb
          cp "$extension" results/pydantic-core-2.50.4-aarch64.so
          {
            echo "replica=${{ matrix.replica }}"
            echo "pydantic_core_version=2.50.4"
            echo "pydantic_upstream_repository=https://github.com/pydantic/pydantic"
            echo "pydantic_upstream_tag=core-v2.50.4"
            echo "pydantic_upstream_commit=$PYDANTIC_COMMIT"
            echo "pydantic_core_tree=$(git -C pydantic-source rev-parse HEAD:pydantic-core)"
            echo "termux_packages_commit=$TERMUX_PACKAGES_COMMIT"
            echo "termux_builder_image=$TERMUX_BUILDER_IMAGE"
            echo "python_abi=cp314"
            echo "android_arch=aarch64"
            echo "package_sha256=$(sha256sum results/python-pydantic-core_2.50.4_aarch64.deb | awk '{print $1}')"
            echo "extension_sha256=$(sha256sum results/pydantic-core-2.50.4-aarch64.so | awk '{print $1}')"
            echo "extension_needed_libraries:"
            readelf -d results/pydantic-core-2.50.4-aarch64.so | grep NEEDED
            echo "extension_runpath=$(patchelf --print-rpath results/pydantic-core-2.50.4-aarch64.so)"
          } > results/build-manifest.txt
          cat results/build-manifest.txt

      - name: Upload independent native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pydantic-core-aarch64-replica-${{ matrix.replica }}
          path: results/
          if-no-files-found: error
          retention-days: 90

  compare-and-attest:
    name: Compare independent builds and attest exact 2.50.4 outputs
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download both independent build outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pydantic-core-aarch64-replica-1 --dir replica-1
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pydantic-core-aarch64-replica-2 --dir replica-2

      - name: Require byte-identical package and extension
        shell: bash
        run: |
          set -euo pipefail
          cmp replica-1/python-pydantic-core_2.50.4_aarch64.deb replica-2/python-pydantic-core_2.50.4_aarch64.deb
          cmp replica-1/pydantic-core-2.50.4-aarch64.so replica-2/pydantic-core-2.50.4-aarch64.so
          test "$(awk -F= '/^package_sha256=/{print $2}' replica-1/build-manifest.txt)" = "$(awk -F= '/^package_sha256=/{print $2}' replica-2/build-manifest.txt)"
          test "$(awk -F= '/^extension_sha256=/{print $2}' replica-1/build-manifest.txt)" = "$(awk -F= '/^extension_sha256=/{print $2}' replica-2/build-manifest.txt)"
          echo "Both independent pydantic-core 2.50.4 packages and extensions are byte-identical."

      - name: Prepare verified artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified
          cp replica-1/python-pydantic-core_2.50.4_aarch64.deb verified/
          cp replica-1/pydantic-core-2.50.4-aarch64.so verified/
          cp replica-1/build-manifest.txt verified/
          (cd verified && sha256sum build-manifest.txt pydantic-core-2.50.4-aarch64.so python-pydantic-core_2.50.4_aarch64.deb > SHA256SUMS)

      - name: Attest Termux package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verified/python-pydantic-core_2.50.4_aarch64.deb

      - name: Attest native extension
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verified/pydantic-core-2.50.4-aarch64.so

      - name: Upload verified reproducible artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-pydantic-core-2.50.4-termux-aarch64
          path: verified/
          if-no-files-found: error
          retention-days: 90

  verify-attestations:
    name: Independently verify pydantic-core 2.50.4 attestations
    needs: compare-and-attest
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_WORKFLOW: ${{ github.repository }}/.github/workflows/termux-pydantic-core-reproducible.yml
      SOURCE_REF: ${{ github.ref }}
    steps:
      - name: Download the existing verified bundle
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name verified-pydantic-core-2.50.4-termux-aarch64 --dir verified

      - name: Independently verify artifact hashes
        working-directory: verified
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          test -s python-pydantic-core_2.50.4_aarch64.deb
          test -s pydantic-core-2.50.4-aarch64.so
          test "$(dpkg-deb -f python-pydantic-core_2.50.4_aarch64.deb Version)" = "2.50.4"
          test "$(dpkg-deb -f python-pydantic-core_2.50.4_aarch64.deb Architecture)" = "aarch64"

      - name: Cryptographically verify package provenance
        run: |
          set -euo pipefail
          gh attestation verify verified/python-pydantic-core_2.50.4_aarch64.deb \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SOURCE_WORKFLOW" \
            --source-ref "$SOURCE_REF" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners

      - name: Cryptographically verify native extension provenance
        run: |
          set -euo pipefail
          gh attestation verify verified/pydantic-core-2.50.4-aarch64.so \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SOURCE_WORKFLOW" \
            --source-ref "$SOURCE_REF" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners
