name: Exact-SHA Render Readiness Evidence

on:
  push:
    branches:
      - deploy/github-practice-ai-render-readiness
    paths:
      - .github/workflows/verify-render-readiness.yml
      - Dockerfile
      - pyproject.toml
      - scripts/**
      - stage2_sdk_ai/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: render-readiness-exact-sha
  cancel-in-progress: false

jobs:
  verify-exact-source:
    name: Tests, lint, Docker build, and image identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.sha }}
      IMAGE_NAME: github-practice-ai:render-readiness-exact-sha
    steps:
      - name: Checkout the immutable target revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact revision and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$actual" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          printf 'TARGET_SHA=%s\n' "$actual" | tee "$RUNNER_TEMP/target-sha.txt"
          git show -s --format='commit=%H%nsubject=%s' HEAD

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,audit-s3]"

      - name: Run Ruff
        run: ruff check .

      - name: Run full repository test suite
        run: python -m pytest -q

      - name: Build Docker image from the exact checkout
        run: docker build --pull --no-cache --tag "$IMAGE_NAME" .

      - name: Prove the image startup drops to the required identity
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/identity-proof"
          data_dir="$RUNNER_TEMP/persistent-data"
          mkdir -p "$proof_dir" "$data_dir"
          cat > "$proof_dir/uvicorn" <<'PY'
          #!/usr/local/bin/python
          import json
          import os
          import stat

          root = os.stat("/var/data")
          result = {
              "euid": os.geteuid(),
              "egid": os.getegid(),
              "supplementary_groups": os.getgroups(),
              "data_root_uid": root.st_uid,
              "data_root_gid": root.st_gid,
              "data_root_mode": oct(stat.S_IMODE(root.st_mode)),
          }
          print(json.dumps(result, sort_keys=True), flush=True)
          assert result["euid"] == 10001, result
          assert result["egid"] == 10001, result
          assert result["supplementary_groups"] == [], result
          assert result["data_root_uid"] == 10001, result
          assert result["data_root_gid"] == 10001, result
          assert stat.S_IMODE(root.st_mode) == 0o700, result
          PY
          chmod 0755 "$proof_dir/uvicorn"

          docker image inspect "$IMAGE_NAME" --format 'IMAGE_ID={{.Id}}'
          docker run --rm \
            --mount "type=bind,src=$proof_dir,dst=/proof,readonly" \
            --mount "type=bind,src=$data_dir,dst=/var/data" \
            --env 'PATH=/proof:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            "$IMAGE_NAME"

      - name: Publish auditable run summary
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' \
              "## Exact-SHA Render Readiness Evidence" \
              "" \
              "- Target source SHA: \`$TARGET_SHA\`" \
              "- Workflow revision: \`$GITHUB_SHA\`" \
              "- Repository: \`$GITHUB_REPOSITORY\`" \
              "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "" \
              "The job checks out the exact SHA associated with this push event, runs Ruff and the full test suite, builds the Docker image, and verifies startup identity and persistent-root permissions inside that image." \
              "" \
              "No deployment, cloud provisioning, production credentials, or repository write permissions are used."
          } >> "$GITHUB_STEP_SUMMARY"
