name: publish-v1.1-to-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0)'
        required: false
        default: '1.1.0'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps binary-only (no Rust)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: build twine ruff pytest-asyncio pytest coverage openai==1.40.0 httpx==0.27.0 cachetools anyio -q
          pip install -e . --only-binary=:all: -q || pip install -e . -q

      - name: Ruff GREEN strict
        run: ruff check .

      - name: Tests 12 passed + Coverage 80% gate
        run: |
          PYTHONPATH=. CI=true OPENAI_API_KEY=sk-test-mocked coverage run -m pytest -q -o addopts=""
          coverage report --fail-under=80

      - name: Build wheel + sdist
        run: |
          rm -rf dist/
          python -m build
          ls -lh dist/
          twine check dist/*

      - name: Publish to PyPI (Trusted Publishing OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If you use API token fallback, set secret PYPI_API_TOKEN in repo settings
          # For trusted publishing, leave blank and configure on pypi.org
          skip-existing: true
          verbose: true

      - name: Publish to TestPyPI (on dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  verify-install:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pip install from PyPI
        run: |
          sleep 30
          pip install --only-binary=:all: github-practice-ai --index-url https://pypi.org/simple/ --extra-index-url https://pypi.org/simple/ -q || echo "PyPI propagation pending"
          python -c "import stage2_sdk_ai; print('installed', stage2_sdk_ai.__name__)"
