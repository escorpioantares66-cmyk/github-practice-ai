name: publish-v1.1-to-pypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    # Manual publishing is restricted to main; release events publish their tag.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package.outputs.version }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build deps binary-only (no Rust)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: build twine ruff pytest-asyncio pytest coverage openai==1.40.0 httpx==0.28.1 cachetools anyio -q
          pip install -e . --only-binary=:all: -q || pip install -e . -q
      - name: Upgrade build tooling to patched versions
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
      - name: Read package version
        id: package
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match pyproject.toml version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --only-binary=:all: pip-audit==2.10.1
          pip-audit --progress-spinner=off
      - name: Ruff strict
        run: ruff check .
      - name: Full test suite + Coverage 80% gate
        run: |
          PYTHONPATH=. CI=true OPENAI_API_KEY=sk-test-mocked coverage run -m pytest -q -o addopts=""
          coverage report --fail-under=80
      - name: Build wheel + sdist
        run: |
          rm -rf dist/
          python -m build
          twine check dist/*
          ls -lh dist/
      - name: Publish to PyPI (Trusted Publishing OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  verify-install:
    needs: build-and-publish
    if: needs.build-and-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify exact package version from PyPI
        env:
          PACKAGE_VERSION: ${{ needs.build-and-publish.outputs.package-version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir --index-url https://pypi.org/simple "github-practice-ai==$PACKAGE_VERSION" -q; then
              if python -c "import stage2_sdk_ai; print('Verified PyPI package', '$PACKAGE_VERSION', stage2_sdk_ai.__name__)"; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "PyPI version $PACKAGE_VERSION not available yet (attempt $attempt/6); retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Could not install and import github-practice-ai==$PACKAGE_VERSION from PyPI."
          exit 1
