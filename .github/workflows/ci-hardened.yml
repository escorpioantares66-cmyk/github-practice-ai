name: ci-hardened-v1.1
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps binary-only + build
        run: |
          pip install --upgrade pip
          pip install --only-binary=:all: openai==1.40.0 httpx==0.28.1 cachetools pytest-asyncio pytest coverage build twine ruff -q
          pip install -e . --only-binary=:all: -q || pip install -e . -q
      - name: Upgrade build tooling to patched versions
        run: |
          python -m pip install --upgrade "setuptools>=84.1.0"
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --only-binary=:all: pip-audit==2.10.1
          pip-audit --progress-spinner=off
      - name: Ruff strict
        run: |
          ruff check .
      - name: Focused approval recovery tests
        run: |
          PYTHONPATH=. CI=true OPENAI_API_KEY=sk-test-mocked pytest -q -o addopts="" tests/test_approval_write_failure.py tests/test_approval_hardening.py tests/test_sandbox_approval_authority.py
      - name: Tests + Coverage 80% gate
        run: |
          PYTHONPATH=. CI=true OPENAI_API_KEY=sk-test-mocked coverage run -m pytest -q -o addopts=""
          coverage report --fail-under=80
          coverage json
      - name: Build wheel + sdist
        run: |
          python -m build
          twine check dist/*
          ls -lh dist/
      - name: gh-ai check
        run: |
          pip install -e . -q
          gh-ai --check
      - name: Read-only storage and retention audit
        run: |
          gh-ai --storage-audit

  sdk-transport-compat:
    name: OpenAI SDK transport (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install candidate SDK transport stack
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "openai==3.46.0" "httpx2==2.16.0" "starlette[full]>=1.2,<2" "fastapi>=0.115" "pytest>=8" "pytest-asyncio>=0.23" "cachetools>=5"
          openssl version
      - name: Verify resolved dependencies and capture security evidence
        run: |
          bash scripts/audit_sdk_candidate_env.sh
          python -c "import httpx2, openai, starlette; print('openai', openai.__version__); print('httpx2', httpx2.__version__); print('starlette', starlette.__version__)"
      - name: Verify real SDK clients and request paths through mock transports
        run: |
          mkdir -p artifacts/sdk-3.46.0
          set -o pipefail
          PYTHONPATH=. python -m pytest -q -o addopts="" tests/test_openai_sdk_transport_compat.py 2>&1 | tee artifacts/sdk-3.46.0/transport-tests.txt
          PYTHONPATH=. python -m pytest -q -o addopts="" tests/test_sdk_transport_network_compat.py 2>&1 | tee artifacts/sdk-3.46.0/network-transport-tests.txt
      - name: Validate Termux build and smoke-test script syntax
        run: |
          bash -n scripts/build_termux_sdk_wheels.sh
          bash -n scripts/build_termux_sdk_wheels_from_pinned_sources.sh
          bash -n scripts/check_termux_sdk_compat.sh
          bash -n scripts/run_termux_sdk_compat_with_evidence.sh
          python -m py_compile scripts/test_termux_sdk_live_tls.py
          set -euo pipefail
          safety_tmp="$(mktemp -d)"
          trap 'rm -rf "$safety_tmp"' EXIT
          existing_root="$safety_tmp/existing"
          mkdir "$existing_root"
          printf 'preserve me\\n' > "$existing_root/marker"
          if SOURCE_BUILD_ROOT="$existing_root" bash scripts/build_termux_sdk_wheels_from_pinned_sources.sh; then
            echo "Builder unexpectedly accepted an existing SOURCE_BUILD_ROOT" >&2
            exit 1
          fi
          test -f "$existing_root/marker"
          new_root="$safety_tmp/new-root"
          if PREFIX="" SOURCE_BUILD_ROOT="$new_root" bash scripts/build_termux_sdk_wheels_from_pinned_sources.sh; then
            echo "Builder unexpectedly passed the non-Termux preflight" >&2
            exit 1
          fi
          test ! -e "$new_root"

          # Reject output paths nested in the historical wheelhouse before
          # creating anything there, and reject build roots nested there too.
          original_root="$safety_tmp/original-wheelhouse"
          mkdir "$original_root"
          printf 'preserve original\\n' > "$original_root/marker"
          nested_output="$original_root/nested-output"
          if PREFIX="" ORIGINAL_WHEELHOUSE_DIR="$original_root" SOURCE_PINNED_WHEELHOUSE_DIR="$nested_output" SOURCE_BUILD_ROOT="$safety_tmp/external-build" bash scripts/build_termux_sdk_wheels_from_pinned_sources.sh; then
            echo "Builder unexpectedly accepted output nested in original wheelhouse" >&2
            exit 1
          fi
          test -f "$original_root/marker"
          test ! -e "$nested_output"
          test ! -e "$safety_tmp/external-build"

          if PREFIX="" ORIGINAL_WHEELHOUSE_DIR="$original_root" SOURCE_PINNED_WHEELHOUSE_DIR="$safety_tmp/external-output" SOURCE_BUILD_ROOT="$original_root/nested-build" bash scripts/build_termux_sdk_wheels_from_pinned_sources.sh; then
            echo "Builder unexpectedly accepted SOURCE_BUILD_ROOT nested in original wheelhouse" >&2
            exit 1
          fi
          test -f "$original_root/marker"
          test ! -e "$original_root/nested-build"
      - name: Upload reproducible SDK assessment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-3.46.0-evidence-python-${{ matrix.python-version }}
          path: artifacts/sdk-3.46.0/
          if-no-files-found: warn
          retention-days: 30
